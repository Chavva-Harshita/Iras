server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: iras-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/iras}
    username: ${DATABASE_USERNAME:iras}
    password: ${DATABASE_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

iras:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
