server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: iras-backend
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/iras}}
    username: ${DB_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD:}}
    hikari:
      initialization-fail-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

iras:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:iras_default_dev_access_secret_key_at_least_32_chars_long!}
    refresh-secret: ${JWT_REFRESH_SECRET:iras_default_dev_refresh_secret_key_at_least_32_chars_long!}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    expose-in-dev-response: ${OTP_EXPOSE_IN_DEV_RESPONSE:true}
  security:
    cookie-secure: ${COOKIE_SECURE:false}
